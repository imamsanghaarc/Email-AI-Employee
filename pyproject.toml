[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-employee-mcp"
version = "0.1.0"
description = "MCP server exposing Odoo, Gmail and LinkedIn as tools, with per-user credential custody and human-approval guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
supabase = ["supabase>=2.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ai-employee-mcp = "ai_employee_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_employee_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true